[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alfamedomega-control-center"
version = "0.1.0"
description = "Standalone control center for Alfamedomega: training, model weights and preference learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
test = ["pytest>=8", "numpy"]

[project.scripts]
alfa-cc = "alfacc.cli:main"

[project.gui-scripts]
alfa-cc-gui = "alfacc.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
