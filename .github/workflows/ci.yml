name: CI

# Manual runs only: there are no Actions minutes, so automatic runs only
# produced failure emails. Run it from the Actions tab when needed.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  tensor-training:
    name: AMO tensor learners (CPU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install learner dependencies
        run: python -m pip install numpy torch pytest
      - name: Test independent tensor learners and contracts
        run: python -m unittest discover -s training/tests -p 'test_amo*.py' -v

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting (clang-format 18)
        run: bash scripts/format.sh --check

  core:
    name: Core libraries (Linux, ${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [core, asan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'src/**/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ninja and model-export tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          python -m pip install numpy onnx
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DALFA_WARNINGS_AS_ERRORS=ON -DCPM_SOURCE_CACHE=$CPM_SOURCE_CACHE
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  rtsan:
    name: Inference under RealtimeSanitizer (Linux, Clang 20)
    runs-on: ubuntu-24.04
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-rtsan-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'src/**/CMakeLists.txt') }}
          restore-keys: cpm-rtsan-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Clang 20, Ninja and model-export tools
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          sudo apt-get install -y ninja-build libclang-rt-20-dev
          python -m pip install numpy onnx
      - name: Configure
        run: cmake --preset core -DCPM_SOURCE_CACHE=$CPM_SOURCE_CACHE
      - name: Build
        run: cmake --build --preset core
      - name: Test
        run: ctest --preset core

  control-center:
    name: Control center (Python 3.11)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries and the app
        if: hashFiles('apps/control-center/pyproject.toml') != ''
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1
          python -m pip install -e "apps/control-center[gui,test]"
      - name: Test
        if: hashFiles('apps/control-center/pyproject.toml') != ''
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest apps/control-center

  render-host:
    name: Control center render host (Linux)
    runs-on: ubuntu-24.04
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        if: hashFiles('apps/control-center/render-host/CMakeLists.txt') != ''
        with:
          path: .cpm-cache
          key: cpm-render-host-${{ runner.os }}-${{ hashFiles('apps/control-center/render-host/**/CMakeLists.txt') }}
          restore-keys: cpm-render-host-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JUCE build dependencies
        if: hashFiles('apps/control-center/render-host/CMakeLists.txt') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev
      - name: Build the render host and test synth
        if: hashFiles('apps/control-center/render-host/CMakeLists.txt') != ''
        run: |
          cmake -S apps/control-center/render-host -B build/render-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"
          cmake --build build/render-host
      - name: Test plugin assimilation against the real host
        if: hashFiles('apps/control-center/render-host/CMakeLists.txt') != ''
        env:
          ALFA_RENDER_HOST: ${{ github.workspace }}/build/render-host/alfa_render_host_artefacts/Release/alfa-render-host
          ALFA_TEST_SYNTH: ${{ github.workspace }}/build/render-host/test-synth/alfa_test_synth_artefacts/Release/VST3/AlfaTestSynth.vst3
        run: |
          python -m pip install -e "apps/control-center[test]"
          python -m pytest apps/control-center/tests/test_assimilate.py

  preference:
    name: Preference learning (Python 3.11)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numpy
        if: hashFiles('preference/tests/**') != ''
        run: python -m pip install numpy
      - name: Test
        if: hashFiles('preference/tests/**') != ''
        working-directory: preference
        run: python -m unittest discover tests

  plugin:
    name: Plugin (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-14
            generator: Ninja
            extra: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"'
            artefacts: build/src/plugin/Alfamedomega_artefacts/Release
            pluginval_zip: pluginval_macOS.zip
            pluginval_bin: ./pluginval.app/Contents/MacOS/pluginval
          - name: Windows x64
            os: windows-2022
            generator: Visual Studio 17 2022
            extra: -A x64
            artefacts: build/src/plugin/Alfamedomega_artefacts/Release
            pluginval_zip: pluginval_Windows.zip
            pluginval_bin: ./pluginval.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'src/**/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model-export tools
        run: python -m pip install numpy onnx
      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G "${{ matrix.generator }}" ${{ matrix.extra }}
          -DCMAKE_BUILD_TYPE=Release
          -DALFA_BUILD_PLUGIN=ON -DALFA_BUILD_TESTS=ON
          -DALFA_WARNINGS_AS_ERRORS=ON
          -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate VST3 with pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval_zip }}"
          unzip -q pluginval.zip
          ${{ matrix.pluginval_bin }} --strictness-level 5 --validate-in-process --skip-gui-tests \
            --validate "${{ matrix.artefacts }}/VST3/Alfamedomega.vst3"
      - uses: actions/upload-artifact@v4
        with:
          name: Alfamedomega-${{ runner.os }}-unsigned
          path: |
            ${{ matrix.artefacts }}/VST3
            ${{ matrix.artefacts }}/AU
            build/src/plugin/Alfamedomega_artefacts/**/VST3
            build/src/plugin/Alfamedomega_artefacts/**/Standalone
          if-no-files-found: warn
          retention-days: 14
